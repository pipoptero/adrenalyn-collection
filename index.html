<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adrenalyn XL 2025-26 | LaLiga Collection</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&family=Saira+Condensed:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Colores oficiales LaLiga EA Sports */
      --laliga-orange: #FF4200;
      --laliga-blue: #001F54;
      --laliga-red: #E6001E;
      --ea-green: #00FF41;
      --ea-cyan: #00E5FF;
      --dark: #05050a;
      --dark-card: #0f0f1a;
      --dark-elevated: #1a1a2e;
      --text: #ffffff;
      --text-dim: #9ba3af;
      --success: #00FF41;
      --warning: #FFB800;
      --border: rgba(255, 255, 255, 0.08);
      --glow-orange: rgba(255, 66, 0, 0.4);
      --glow-cyan: rgba(0, 229, 255, 0.4);
    }

    body {
      font-family: 'Saira Condensed', sans-serif;
      background: var(--dark);
      color: var(--text);
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 66, 0, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 229, 255, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
      animation: bgPulse 8s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* Stadium pattern overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        repeating-linear-gradient(90deg, transparent 0px, rgba(255, 255, 255, 0.01) 1px, transparent 2px, transparent 100px),
        repeating-linear-gradient(0deg, transparent 0px, rgba(255, 255, 255, 0.01) 1px, transparent 2px, transparent 100px);
      pointer-events: none;
      z-index: 0;
    }

    #root {
      position: relative;
      z-index: 1;
    }

    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0;
    }

    /* Hero Header with Stadium */
    .hero-header {
      position: relative;
      height: 400px;
      overflow: hidden;
      margin-bottom: 40px;
      background: linear-gradient(135deg, var(--laliga-blue) 0%, #000814 100%);
    }

    .stadium-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400"><defs><pattern id="stadium" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse"><circle cx="60" cy="60" r="2" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect fill="url(%23stadium)" width="1200" height="400"/><ellipse cx="600" cy="350" rx="400" ry="100" fill="rgba(0,229,255,0.03)" stroke="rgba(0,229,255,0.2)" stroke-width="2"/><ellipse cx="600" cy="350" rx="300" ry="75" fill="none" stroke="rgba(0,229,255,0.15)" stroke-width="1"/><circle cx="600" cy="350" r="50" fill="none" stroke="rgba(255,66,0,0.2)" stroke-width="2"/></svg>') center center / cover;
      opacity: 0.4;
      animation: stadiumPulse 4s ease-in-out infinite;
    }

    @keyframes stadiumPulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.02); opacity: 0.5; }
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 80px 20px 40px;
    }

    .laliga-badge {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--laliga-orange), var(--laliga-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Teko', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      box-shadow: 0 0 40px var(--glow-orange);
      animation: badgeFloat 3s ease-in-out infinite;
    }

    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .hero-title {
      font-family: 'Teko', sans-serif;
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--laliga-orange) 0%, var(--ea-cyan) 50%, var(--laliga-orange) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      animation: gradientShift 3s ease infinite;
      text-shadow: 0 0 80px var(--glow-orange);
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }

    .hero-subtitle {
      font-family: 'Teko', sans-serif;
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 30px;
    }

    .hero-stats-quick {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .quick-stat {
      text-align: center;
    }

    .quick-stat-value {
      font-family: 'Teko', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--ea-cyan), var(--success));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .quick-stat-label {
      font-size: 0.9rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Main content area */
    .content-wrapper {
      padding: 0 20px 40px;
    }

    /* Stats Grid - Gaming Style */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--dark-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--laliga-orange), var(--ea-cyan));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.6s ease;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--glow-orange) 0%, transparent 70%);
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .stat-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--laliga-orange);
      box-shadow: 0 20px 60px var(--glow-orange);
    }

    .stat-card:hover::before {
      transform: scaleX(1);
    }

    .stat-card:hover::after {
      opacity: 0.1;
    }

    .stat-icon {
      font-size: 2.5rem;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 10px var(--laliga-orange));
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .stat-value {
      font-family: 'Teko', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      text-shadow: 0 0 20px var(--glow-cyan);
    }

    .stat-progress {
      margin-top: 15px;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .stat-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--laliga-orange), var(--ea-cyan), var(--success));
      background-size: 200% 100%;
      border-radius: 4px;
      transition: width 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      animation: progressShine 2s ease-in-out infinite;
    }

    @keyframes progressShine {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }

    /* Tabs - Gaming Style */
    .tabs-container {
      margin-bottom: 30px;
      position: relative;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
      position: relative;
    }

    .tabs::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .tab {
      padding: 15px 30px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: 'Teko', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
    }

    .tab::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, var(--laliga-orange), var(--ea-cyan));
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 8px 8px 0 0;
    }

    .tab span {
      position: relative;
      z-index: 1;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab:hover::before {
      opacity: 0.1;
    }

    .tab.active {
      color: var(--laliga-orange);
      border-bottom-color: var(--laliga-orange);
      text-shadow: 0 0 20px var(--glow-orange);
    }

    .tab.active::before {
      opacity: 0.15;
    }

    /* Export buttons */
    .export-section {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding: 20px;
      background: var(--dark-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .export-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--laliga-orange), var(--laliga-red));
      border: none;
      border-radius: 8px;
      color: var(--text);
      font-family: 'Teko', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--glow-orange);
      position: relative;
      overflow: hidden;
    }

    .export-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    .export-btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .export-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 30px var(--glow-orange);
    }

    .export-btn:active {
      transform: translateY(-1px) scale(1.02);
    }

    .export-btn span {
      position: relative;
      z-index: 1;
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-select, .search-input {
      padding: 12px 20px;
      background: var(--dark-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Saira Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .filter-select:focus, .search-input:focus {
      outline: none;
      border-color: var(--laliga-orange);
      box-shadow: 0 0 20px var(--glow-orange);
      background: var(--dark-elevated);
    }

    .search-input {
      flex: 1;
      min-width: 200px;
    }

    .filter-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .chip {
      padding: 10px 20px;
      background: var(--dark-card);
      border: 2px solid var(--border);
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    .chip::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 66, 0, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .chip:hover::before {
      left: 100%;
    }

    .chip:hover {
      border-color: var(--laliga-orange);
      transform: translateY(-2px);
    }

    .chip.active {
      background: linear-gradient(135deg, var(--laliga-orange), var(--laliga-red));
      border-color: var(--laliga-orange);
      color: var(--text);
      box-shadow: 0 4px 20px var(--glow-orange);
      transform: scale(1.05);
    }

    /* Cards grid - Enhanced */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--dark-card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      animation: cardFadeIn 0.6s ease;
      overflow: hidden;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--glow-cyan) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-12px) rotate(-2deg) scale(1.05);
      border-color: var(--ea-cyan);
      box-shadow: 0 20px 60px var(--glow-cyan);
    }

    .card:hover::before {
      opacity: 0.15;
    }

    .card.owned {
      border-color: var(--success);
      background: linear-gradient(135deg, var(--dark-card) 0%, rgba(0, 255, 65, 0.05) 100%);
    }

    .card.owned:hover {
      border-color: var(--success);
      box-shadow: 0 20px 60px rgba(0, 255, 65, 0.3);
    }

    .card.repeated {
      border-color: var(--warning);
      background: linear-gradient(135deg, var(--dark-card) 0%, rgba(255, 184, 0, 0.05) 100%);
    }

    .card.repeated:hover {
      border-color: var(--warning);
      box-shadow: 0 20px 60px rgba(255, 184, 0, 0.3);
    }

    .card-number {
      position: absolute;
      top: 12px;
      right: 12px;
      font-family: 'Teko', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-dim);
      text-shadow: 0 0 10px var(--glow-orange);
    }

    .card-name {
      font-family: 'Teko', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.2;
      padding-right: 50px;
      color: var(--text);
    }

    .card-team {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 15px;
      line-height: 1.3;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .status-badge.owned {
      background: var(--success);
      color: var(--dark);
    }

    .status-badge.missing {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
    }

    .repeated-count {
      font-family: 'Teko', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--warning);
      text-shadow: 0 0 10px rgba(255, 184, 0, 0.5);
    }

    /* Category sections */
    .category-section {
      margin-bottom: 50px;
      animation: sectionFadeIn 0.8s ease;
    }

    @keyframes sectionFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding: 25px 30px;
      background: linear-gradient(135deg, rgba(255, 66, 0, 0.1) 0%, transparent 100%);
      border-left: 5px solid var(--laliga-orange);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    .category-header::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 200px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.05));
      pointer-events: none;
    }

    .category-title {
      font-family: 'Teko', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--laliga-orange), var(--ea-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .category-stats {
      display: flex;
      gap: 30px;
      align-items: center;
      flex-wrap: wrap;
    }

    .category-stat {
      text-align: center;
    }

    .category-stat-value {
      font-family: 'Teko', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--ea-cyan);
      text-shadow: 0 0 15px var(--glow-cyan);
      line-height: 1;
    }

    .category-stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
      font-weight: 600;
    }

    /* Team view specific */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .team-card {
      background: var(--dark-card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 25px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .team-card:hover {
      transform: translateY(-5px);
      border-color: var(--laliga-orange);
      box-shadow: 0 15px 40px var(--glow-orange);
    }

    .team-name {
      font-family: 'Teko', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 15px;
      color: var(--text);
    }

    .team-progress {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .team-progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .team-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--laliga-orange), var(--ea-cyan));
      transition: width 1s ease;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.3;
      filter: grayscale(1);
    }

    .empty-state-text {
      font-size: 1.2rem;
      font-family: 'Teko', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 100px 20px;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--border);
      border-top-color: var(--laliga-orange);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: 'Teko', sans-serif;
      font-size: 1.5rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero-header {
        height: 300px;
      }

      .hero-content {
        padding: 50px 20px 30px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .cards-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 15px;
      }

      .category-header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }

      .export-section {
        flex-direction: column;
      }

      .export-btn {
        width: 100%;
      }

      .team-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Scrollbar custom */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--dark);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, var(--laliga-orange), var(--ea-cyan));
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, var(--laliga-red), var(--success));
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Utilidad para exportar a Excel
    function exportToExcel(data, filename) {
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Datos");
      XLSX.writeFile(wb, filename);
    }

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [filterEquipo, setFilterEquipo] = useState('todos');
      const [filterEstado, setFilterEstado] = useState('todos');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('REGULARES');

      // Cargar datos desde JSON
      useEffect(() => {
        fetch('data/adrenalyn_data.json')
          .then(response => {
            if (!response.ok) throw new Error('Error al cargar los datos');
            return response.json();
          })
          .then(jsonData => {
            setData(jsonData);
            setLoading(false);
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      const totalCartas = useMemo(() => {
        if (!data) return 0;
        const totalRes = data.resumen.find(r => r.categoria === 'TOTAL COLECCIÓN');
        return totalRes ? totalRes.total : data.resumen.reduce((sum, cat) => {
          if (cat.categoria !== 'TOTAL COLECCIÓN') return sum + cat.total;
          return sum;
        }, 0);
      }, [data]);

      const totalTengo = useMemo(() => {
        if (!data) return 0;
        const totalRes = data.resumen.find(r => r.categoria === 'TOTAL COLECCIÓN');
        return totalRes ? totalRes.tengo : data.resumen.reduce((sum, cat) => {
          if (cat.categoria !== 'TOTAL COLECCIÓN') return sum + cat.tengo;
          return sum;
        }, 0);
      }, [data]);

      const totalFaltan = useMemo(() => {
        if (!data) return 0;
        const totalRes = data.resumen.find(r => r.categoria === 'TOTAL COLECCIÓN');
        return totalRes ? totalRes.faltan : data.resumen.reduce((sum, cat) => {
          if (cat.categoria !== 'TOTAL COLECCIÓN') return sum + cat.faltan;
          return sum;
        }, 0);
      }, [data]);

      const progresoTotal = useMemo(() => {
        return (totalTengo / totalCartas * 100).toFixed(1);
      }, [totalTengo, totalCartas]);

      const totalRepetidos = useMemo(() => {
        if (!data) return 0;
        return data.regulares.reduce((sum, card) => sum + card.repetidos, 0);
      }, [data]);

      const todasLasCartas = useMemo(() => {
        if (!data) return [];
        const cartas = [...data.regulares];
        Object.entries(data.especiales).forEach(([categoria, cards]) => {
          cards.forEach(card => {
            cartas.push({...card, categoria, repetidos: 0});
          });
        });
        return cartas;
      }, [data]);

      const cartasFiltradas = useMemo(() => {
        if (!data) return [];
        let cartas = todasLasCartas;

        if (selectedCategory !== 'TODAS') {
          if (selectedCategory === 'REGULARES') {
            cartas = data.regulares;
          } else {
            cartas = data.especiales[selectedCategory] || [];
          }
        }

        return cartas.filter(carta => {
          const matchEquipo = filterEquipo === 'todos' || carta.equipo === filterEquipo;
          const matchEstado = filterEstado === 'todos' || 
            (filterEstado === 'tengo' && carta.tengo) ||
            (filterEstado === 'faltan' && !carta.tengo) ||
            (filterEstado === 'repetidos' && carta.repetidos > 0);
          const matchSearch = carta.nombre.toLowerCase().includes(searchTerm.toLowerCase()) ||
                             carta.equipo.toLowerCase().includes(searchTerm.toLowerCase());
          
          return matchEquipo && matchEstado && matchSearch;
        });
      }, [data, filterEquipo, filterEstado, searchTerm, selectedCategory, todasLasCartas]);

      const categorias = useMemo(() => {
        if (!data) return [];
        return ['TODAS', 'REGULARES', ...Object.keys(data.especiales)];
      }, [data]);

      // Estadísticas por equipo
      const estatsPorEquipo = useMemo(() => {
        if (!data) return [];
        const equiposMap = {};
        
        data.regulares.forEach(carta => {
          if (!equiposMap[carta.equipo]) {
            equiposMap[carta.equipo] = { total: 0, tengo: 0, faltan: 0 };
          }
          equiposMap[carta.equipo].total++;
          if (carta.tengo) {
            equiposMap[carta.equipo].tengo++;
          } else {
            equiposMap[carta.equipo].faltan++;
          }
        });

        return Object.entries(equiposMap).map(([equipo, stats]) => ({
          equipo,
          ...stats,
          progreso: (stats.tengo / stats.total * 100).toFixed(1)
        })).sort((a, b) => b.progreso - a.progreso);
      }, [data]);

      // Funciones de exportación
      const exportarFaltantes = () => {
        const faltantes = todasLasCartas.filter(c => !c.tengo).map(c => ({
          'Número': c.numero,
          'Nombre': c.nombre,
          'Equipo': c.equipo,
          'Categoría': c.categoria || 'REGULARES'
        }));
        exportToExcel(faltantes, 'Adrenalyn_Cartas_Faltantes.xlsx');
      };

      const exportarRepetidos = () => {
        const repetidos = data.regulares.filter(c => c.repetidos > 0).map(c => ({
          'Número': c.numero,
          'Nombre': c.nombre,
          'Equipo': c.equipo,
          'Cantidad': c.repetidos
        }));
        exportToExcel(repetidos, 'Adrenalyn_Cartas_Repetidas.xlsx');
      };

      const exportarIntercambios = () => {
        const faltantes = todasLasCartas.filter(c => !c.tengo).map(c => ({
          'Tipo': 'ME FALTA',
          'Número': c.numero,
          'Nombre': c.nombre,
          'Equipo': c.equipo,
          'Categoría': c.categoria || 'REGULARES'
        }));
        
        const repetidos = data.regulares.filter(c => c.repetidos > 0).map(c => ({
          'Tipo': 'REPETIDO',
          'Número': c.numero,
          'Nombre': c.nombre,
          'Equipo': c.equipo,
          'Cantidad': c.repetidos
        }));

        const intercambios = [...faltantes, ...repetidos];
        exportToExcel(intercambios, 'Adrenalyn_Lista_Intercambios.xlsx');
      };

      if (loading) {
        return (
          <div className="app-container">
            <div className="loading">
              <div className="loading-spinner"></div>
              <div className="loading-text">Cargando colección...</div>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="app-container">
            <div className="content-wrapper">
              <div className="empty-state">
                <div className="empty-state-icon">⚠️</div>
                <div className="empty-state-text">Error: {error}</div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="app-container">
          {/* Hero Header */}
          <div className="hero-header">
            <div className="stadium-bg"></div>
            <div className="hero-content">
              <div className="laliga-badge">⚽</div>
              <h1 className="hero-title">Adrenalyn XL</h1>
              <p className="hero-subtitle">LaLiga EA Sports 2025-26</p>
              <div className="hero-stats-quick">
                <div className="quick-stat">
                  <div className="quick-stat-value">{totalCartas}</div>
                  <div className="quick-stat-label">Total</div>
                </div>
                <div className="quick-stat">
                  <div className="quick-stat-value">{progresoTotal}%</div>
                  <div className="quick-stat-label">Completado</div>
                </div>
                <div className="quick-stat">
                  <div className="quick-stat-value">{totalRepetidos}</div>
                  <div className="quick-stat-label">Repetidos</div>
                </div>
              </div>
            </div>
          </div>

          <div className="content-wrapper">
            {/* Stats Grid */}
            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-icon">🎯</div>
                <div className="stat-label">Total Cartas</div>
                <div className="stat-value">{totalCartas}</div>
              </div>

              <div className="stat-card">
                <div className="stat-icon">✅</div>
                <div className="stat-label">Coleccionadas</div>
                <div className="stat-value" style={{color: 'var(--success)'}}>{totalTengo}</div>
                <div className="stat-progress">
                  <div className="stat-progress-bar" style={{width: `${progresoTotal}%`}}></div>
                </div>
              </div>

              <div className="stat-card">
                <div className="stat-icon">🔍</div>
                <div className="stat-label">Por Conseguir</div>
                <div className="stat-value" style={{color: 'var(--laliga-orange)'}}>{totalFaltan}</div>
              </div>

              <div className="stat-card">
                <div className="stat-icon">🔄</div>
                <div className="stat-label">Repetidos</div>
                <div className="stat-value" style={{color: 'var(--warning)'}}>{totalRepetidos}</div>
              </div>
            </div>

            {/* Export Section */}
            <div className="export-section">
              <button className="export-btn" onClick={exportarFaltantes}>
                <span>📥 Exportar Faltantes</span>
              </button>
              <button className="export-btn" onClick={exportarRepetidos}>
                <span>📥 Exportar Repetidos</span>
              </button>
              <button className="export-btn" onClick={exportarIntercambios}>
                <span>📥 Lista Intercambios</span>
              </button>
            </div>

            {/* Tabs */}
            <div className="tabs-container">
              <div className="tabs">
                <button 
                  className={`tab ${activeTab === 'dashboard' ? 'active' : ''}`}
                  onClick={() => setActiveTab('dashboard')}
                >
                  <span>📊 Dashboard</span>
                </button>
                <button 
                  className={`tab ${activeTab === 'coleccion' ? 'active' : ''}`}
                  onClick={() => setActiveTab('coleccion')}
                >
                  <span>🃏 Colección</span>
                </button>
                <button 
                  className={`tab ${activeTab === 'equipos' ? 'active' : ''}`}
                  onClick={() => setActiveTab('equipos')}
                >
                  <span>⚽ Por Equipos</span>
                </button>
                <button 
                  className={`tab ${activeTab === 'estadisticas' ? 'active' : ''}`}
                  onClick={() => setActiveTab('estadisticas')}
                >
                  <span>📈 Estadísticas</span>
                </button>
                <button 
                  className={`tab ${activeTab === 'repetidos' ? 'active' : ''}`}
                  onClick={() => setActiveTab('repetidos')}
                >
                  <span>🔄 Repetidos ({totalRepetidos})</span>
                </button>
              </div>
            </div>

            {/* Dashboard View */}
            {activeTab === 'dashboard' && (
              <div>
                {data.resumen.filter(cat => cat.categoria !== 'TOTAL COLECCIÓN').map((cat, idx) => (
                  <div key={idx} className="category-section">
                    <div className="category-header">
                      <div className="category-title">{cat.categoria}</div>
                      <div className="category-stats">
                        <div className="category-stat">
                          <div className="category-stat-value">{cat.tengo}</div>
                          <div className="category-stat-label">Tengo</div>
                        </div>
                        <div className="category-stat">
                          <div className="category-stat-value" style={{color: 'var(--laliga-orange)'}}>{cat.faltan}</div>
                          <div className="category-stat-label">Faltan</div>
                        </div>
                        <div className="category-stat">
                          <div className="category-stat-value" style={{color: 'var(--warning)'}}>
                            {(cat.progreso * 100).toFixed(0)}%
                          </div>
                          <div className="category-stat-label">Progreso</div>
                        </div>
                      </div>
                    </div>
                    <div className="stat-progress">
                      <div className="stat-progress-bar" style={{width: `${cat.progreso * 100}%`}}></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Colección View */}
            {activeTab === 'coleccion' && (
              <div>
                <div className="filter-bar">
                  <select 
                    className="filter-select" 
                    value={selectedCategory}
                    onChange={(e) => setSelectedCategory(e.target.value)}
                  >
                    {categorias.map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>

                  <select 
                    className="filter-select" 
                    value={filterEquipo}
                    onChange={(e) => setFilterEquipo(e.target.value)}
                  >
                    <option value="todos">Todos los equipos</option>
                    {data.equipos.map(eq => (
                      <option key={eq} value={eq}>{eq}</option>
                    ))}
                  </select>

                  <input 
                    type="text"
                    className="search-input"
                    placeholder="🔍 Buscar jugador o equipo..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />
                </div>

                <div className="filter-chips">
                  <div 
                    className={`chip ${filterEstado === 'todos' ? 'active' : ''}`}
                    onClick={() => setFilterEstado('todos')}
                  >
                    Todas ({todasLasCartas.length})
                  </div>
                  <div 
                    className={`chip ${filterEstado === 'tengo' ? 'active' : ''}`}
                    onClick={() => setFilterEstado('tengo')}
                  >
                    ✓ Tengo ({todasLasCartas.filter(c => c.tengo).length})
                  </div>
                  <div 
                    className={`chip ${filterEstado === 'faltan' ? 'active' : ''}`}
                    onClick={() => setFilterEstado('faltan')}
                  >
                    Faltan ({todasLasCartas.filter(c => !c.tengo).length})
                  </div>
                  <div 
                    className={`chip ${filterEstado === 'repetidos' ? 'active' : ''}`}
                    onClick={() => setFilterEstado('repetidos')}
                  >
                    Repetidos ({totalRepetidos})
                  </div>
                </div>

                <div className="cards-grid">
                  {cartasFiltradas.map(carta => (
                    <div 
                      key={`${carta.numero}-${carta.categoria || 'reg'}`}
                      className={`card ${carta.tengo ? 'owned' : ''} ${carta.repetidos > 0 ? 'repeated' : ''}`}
                    >
                      <div className="card-number">#{carta.numero}</div>
                      <div className="card-name">{carta.nombre}</div>
                      <div className="card-team">{carta.equipo}</div>
                      <div className="card-status">
                        <span className={`status-badge ${carta.tengo ? 'owned' : 'missing'}`}>
                          {carta.tengo ? '✓ Tengo' : 'Falta'}
                        </span>
                        {carta.repetidos > 0 && (
                          <span className="repeated-count">x{carta.repetidos}</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                {cartasFiltradas.length === 0 && (
                  <div className="empty-state">
                    <div className="empty-state-icon">🔍</div>
                    <div className="empty-state-text">No se encontraron cartas</div>
                  </div>
                )}
              </div>
            )}

            {/* Vista por Equipos */}
            {activeTab === 'equipos' && (
              <div>
                <div className="team-grid">
                  {estatsPorEquipo.map(team => (
                    <div 
                      key={team.equipo} 
                      className="team-card"
                      onClick={() => {
                        setActiveTab('coleccion');
                        setFilterEquipo(team.equipo);
                      }}
                    >
                      <div className="team-name">{team.equipo}</div>
                      <div className="team-progress">
                        <span>{team.tengo} / {team.total}</span>
                        <span style={{color: 'var(--ea-cyan)'}}>{team.progreso}%</span>
                      </div>
                      <div className="team-progress-bar">
                        <div 
                          className="team-progress-fill" 
                          style={{width: `${team.progreso}%`}}
                        ></div>
                      </div>
                      <div style={{marginTop: '10px', fontSize: '0.85rem', color: 'var(--text-dim)'}}>
                        Faltan: {team.faltan} cartas
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Estadísticas Avanzadas */}
            {activeTab === 'estadisticas' && (
              <div>
                <div className="category-section">
                  <div className="category-header">
                    <div className="category-title">📊 Progreso por Equipo</div>
                  </div>
                  <div className="team-grid">
                    {estatsPorEquipo.map((team, idx) => (
                      <div key={team.equipo} className="team-card">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px'}}>
                          <span style={{fontSize: '1.5rem', fontWeight: '700'}}>#{idx + 1}</span>
                          <span style={{fontSize: '2rem', fontFamily: 'Teko', color: 'var(--ea-cyan)'}}>
                            {team.progreso}%
                          </span>
                        </div>
                        <div className="team-name">{team.equipo}</div>
                        <div className="team-progress-bar">
                          <div 
                            className="team-progress-fill" 
                            style={{width: `${team.progreso}%`}}
                          ></div>
                        </div>
                        <div style={{marginTop: '10px', display: 'flex', justifyContent: 'space-between', fontSize: '0.85rem'}}>
                          <span style={{color: 'var(--success)'}}>✓ {team.tengo}</span>
                          <span style={{color: 'var(--laliga-orange)'}}> {team.faltan}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="category-section">
                  <div className="category-header">
                    <div className="category-title">🏆 Categoría Más Completa</div>
                  </div>
                  <div className="team-grid">
                    {data.resumen
                      .filter(cat => cat.categoria !== 'TOTAL COLECCIÓN')
                      .sort((a, b) => b.progreso - a.progreso)
                      .map((cat, idx) => (
                        <div key={cat.categoria} className="team-card">
                          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px'}}>
                            <span style={{fontSize: '1.5rem'}}>
                              {idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}
                            </span>
                            <span style={{fontSize: '2rem', fontFamily: 'Teko', color: 'var(--warning)'}}>
                              {(cat.progreso * 100).toFixed(0)}%
                            </span>
                          </div>
                          <div className="team-name">{cat.categoria}</div>
                          <div className="team-progress-bar">
                            <div 
                              className="team-progress-fill" 
                              style={{width: `${cat.progreso * 100}%`}}
                            ></div>
                          </div>
                          <div style={{marginTop: '10px', display: 'flex', justifyContent: 'space-between', fontSize: '0.85rem'}}>
                            <span style={{color: 'var(--success)'}}>✓ {cat.tengo}/{cat.total}</span>
                            <span style={{color: 'var(--laliga-orange)'}}>Faltan {cat.faltan}</span>
                          </div>
                        </div>
                      ))}
                  </div>
                </div>
              </div>
            )}

            {/* Repetidos View */}
            {activeTab === 'repetidos' && (
              <div>
                <div className="cards-grid">
                  {data.regulares.filter(c => c.repetidos > 0).map(carta => (
                    <div 
                      key={carta.numero}
                      className="card repeated"
                    >
                      <div className="card-number">#{carta.numero}</div>
                      <div className="card-name">{carta.nombre}</div>
                      <div className="card-team">{carta.equipo}</div>
                      <div className="card-status">
                        <span className="status-badge owned">✓ Tengo</span>
                        <span className="repeated-count">x{carta.repetidos}</span>
                      </div>
                    </div>
                  ))}
                </div>

                {data.regulares.filter(c => c.repetidos > 0).length === 0 && (
                  <div className="empty-state">
                    <div className="empty-state-icon">📦</div>
                    <div className="empty-state-text">No tienes cartas repetidas</div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
