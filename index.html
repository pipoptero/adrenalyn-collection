<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADRENALYN XL 25-26 | Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --laliga: #ff0050; --bg: #0a0a0c; --card: #16161d; --gold: #ffd700; --green: #00ff88; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--laliga); padding-bottom: 15px; margin-bottom: 25px; }
        .logo { font-family: 'Barlow Condensed'; font-size: 2.2rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { display: block; font-size: 1.8rem; font-family: 'Barlow Condensed'; color: var(--laliga); }
        .filter-box { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 25px; display: flex; gap: 12px; flex-wrap: wrap; }
        input, select { background: #252530; border: 1px solid #333; color: white; padding: 10px; border-radius: 6px; flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .c-card { background: var(--card); border-radius: 12px; padding: 12px; position: relative; border: 1px solid #222; }
        .c-card.tengo { border-bottom: 4px solid var(--green); }
        .c-card.falta { opacity: 0.3; filter: grayscale(1); }
        .btn { border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .btn-excel { background: #217346; color: white; }
        .btn-wa { background: var(--gold); color: black; }
        .badge-repe { position: absolute; top: -8px; right: -8px; background: var(--gold); color: black; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [data, setData] = useState(null);
            const [error, setError] = useState(false);
            const [search, setSearch] = useState("");

            useEffect(() => {
                fetch('data/adrenalyn_data.json')
                    .then(res => {
                        if (!res.ok) throw new Error("No se encuentra el JSON");
                        return res.json();
                    })
                    .then(setData)
                    .catch(err => {
                        console.error(err);
                        setError(true);
                    });
            }, []);

            const copyInterchange = () => {
                const repes = data.cartas.filter(c => c.repetidos > 0);
                const text = "📋 MIS REPETIDOS ADRENALYN 25-26:\n" + 
                    repes.map(c => `#${c.id} ${c.nombre} x${c.repetidos}`).join("\n");
                navigator.clipboard.writeText(text);
                alert("¡Lista copiada!");
            };

            if (error) return (
                <div style={{padding: 50, textAlign: 'center'}}>
                    <h2>⚠️ Error: Datos no encontrados</h2>
                    <p>Parece que el archivo <b>data/adrenalyn_data.json</b> aún no se ha creado.</p>
                    <p>Revisa la pestaña <b>Actions</b> en tu GitHub para ver si el script falló.</p>
                </div>
            );

            if (!data) return <div style={{padding: 50, textAlign: 'center'}}>Cargando vestuarios...</div>;

            const filtered = data.cartas.filter(c => 
                c.nombre.toLowerCase().includes(search.toLowerCase()) || c.id.toString() === search
            );

            return (
                <div>
                    <header className="top-bar">
                        <div className="logo">ADRENALYN <span style={{color: 'var(--laliga)'}}>XL</span> 25-26</div>
                        <div style={{display: 'flex', gap: '10px'}}>
                            <button onClick={copyInterchange} className="btn btn-wa"><i className="fab fa-whatsapp"></i> REPES</button>
                        </div>
                    </header>

                    <div className="stats">
                        <div className="stat-item"><span className="stat-val">{data.cartas.length}</span>TOTAL</div>
                        <div className="stat-item"><span className="stat-val">{data.cartas.filter(c => c.tengo).length}</span>TENGO</div>
                        <div className="stat-item"><span className="stat-val" style={{color: 'var(--green)'}}>{Math.round((data.cartas.filter(c => c.tengo).length/data.cartas.length)*100)}%</span>COMPLETO</div>
                    </div>

                    <div className="filter-box">
                        <input placeholder="Buscar por nombre o número..." onChange={e => setSearch(e.target.value)} />
                    </div>

                    <div className="grid">
                        {filtered.map(c => (
                            <div key={c.id} className={`c-card ${c.tengo ? 'tengo' : 'falta'}`}>
                                {c.repetidos > 0 && <div className="badge-repe">x{c.repetidos}</div>}
                                <div style={{fontSize: '0.7rem', color: '#888'}}>#{c.id}</div>
                                <div style={{fontWeight: 'bold', fontSize: '0.9rem'}}>{c.nombre}</div>
                                <div style={{fontSize: '0.7rem', color: 'var(--laliga)'}}>{c.equipo}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
